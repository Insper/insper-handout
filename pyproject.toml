[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insper-handout"
version = "0.1.0"
description = "Build Insper handouts from Markdown using Pandoc templates."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandocfilters",
]

[project.scripts]
"insper_handout.py" = "insper_handout_app.cli:main"
"insper-handout" = "insper_handout_app.cli:main"

[tool.setuptools]
packages = ["insper_handout", "insper_handout_app", "data_files"]

[tool.setuptools.package-data]
data_files = ["*"]
